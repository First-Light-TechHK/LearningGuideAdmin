# DEV deploy for admin.ilovelearningguide.com.
# Requires repo variable ADMIN_DEV_APP_RUNNER_SERVICE_ARN; the workflow fails with
# a clear message until the service is provisioned.
name: Deploy DEV

on:
  workflow_run:
    workflows: [CI]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only the dev branch may deploy, and only into the Admin DEV environment.
    # A manual run from another ref is allowed in, then rejected by the first
    # step so the operator sees an explicit error instead of a silent skip.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-dev refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Deploy DEV may only be dispatched from the dev branch (got ${{ github.ref }})."
          exit 1
      - uses: actions/checkout@v4
      - name: Require the DEV service ARN
        env:
          ARN: ${{ vars.ADMIN_DEV_APP_RUNNER_SERVICE_ARN }}
        run: |
          if [ -z "$ARN" ]; then
            echo "::error::ADMIN_DEV_APP_RUNNER_SERVICE_ARN is not set. Provision the DEV App Runner service first."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Start App Runner deployment and wait for the result
        env:
          ARN: ${{ vars.ADMIN_DEV_APP_RUNNER_SERVICE_ARN }}
        run: |
          set -u
          # start-deployment only accepts the request. Without polling, a build
          # that rolls back still shows a green workflow (this happened on
          # 2026-10-24: ROLLBACK_SUCCEEDED while the run reported success).
          out="$(aws apprunner start-deployment --service-arn "$ARN" --output json)"
          printf '%s\n' "$out"
          op="$(printf '%s\n' "$out" | jq -r '.OperationId // empty')"
          if [ -z "$op" ]; then
            echo "::error::start-deployment returned no OperationId"
            exit 1
          fi

          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(aws apprunner list-operations \
              --service-arn "$ARN" \
              --query "OperationSummaryList[?Id=='${op}'].Status | [0]" \
              --output text)"
            echo "deployment ${op} status=${status:-unknown}"
            case "$status" in
              SUCCEEDED) exit 0 ;;
              FAILED|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED)
                echo "::error::App Runner deployment ${op} ended as ${status}"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::timed out waiting for deployment ${op}"
          exit 1
