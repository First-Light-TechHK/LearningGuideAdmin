# Deploy the Admin DEV environment (admin.ilovelearningguide.com).
# Scope is deliberately narrow: a push to `dev` is the only trigger, and the
# target is the single Admin DEV App Runner service. No other branch, tag or
# manual ref can deploy. App Runner's own branch auto-deploy is disabled so
# this workflow is the only publisher.
name: Deploy DEV

on:
  push:
    branches: [dev]

concurrency:
  group: admin-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the DEV service ARN
        env:
          ARN: ${{ vars.ADMIN_DEV_APP_RUNNER_SERVICE_ARN }}
        run: |
          if [ -z "$ARN" ]; then
            echo "::error::ADMIN_DEV_APP_RUNNER_SERVICE_ARN is not set. Provision the DEV App Runner service first."
            exit 1
          fi

      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for _ in $(seq 1 90); do
            conclusion="$(gh api "repos/$REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=30" \
              --jq '.workflow_runs[] | select(.name == "CI") | .conclusion' 2>/dev/null | head -1)"
            case "${conclusion:-}" in
              success) echo "CI passed for $GITHUB_SHA"; exit 0 ;;
              failure|cancelled|timed_out|action_required)
                echo "::error::CI on $GITHUB_SHA ended as $conclusion"
                exit 1
                ;;
            esac
            echo "CI not finished yet (${conclusion:-running}); waiting"
            sleep 20
          done
          echo "::error::timed out waiting for CI on $GITHUB_SHA"
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Start App Runner deployment and wait for the result
        env:
          ARN: ${{ vars.ADMIN_DEV_APP_RUNNER_SERVICE_ARN }}
        run: |
          set -u
          # App Runner rejects start-deployment unless the service is RUNNING,
          # so wait for any in-flight operation to settle and retry the request.
          for _ in $(seq 1 80); do
            svc_status="$(aws apprunner describe-service --service-arn "$ARN" --query 'Service.Status' --output text)"
            [ "$svc_status" = "RUNNING" ] && break
            echo "service ${svc_status}; waiting for RUNNING"
            sleep 15
          done

          # start-deployment only accepts the request. Without polling, a build
          # that rolls back still shows a green workflow (this happened on
          # 2026-10-24: ROLLBACK_SUCCEEDED while the run reported success).
          op=""
          for _ in $(seq 1 10); do
            if out="$(aws apprunner start-deployment --service-arn "$ARN" --output json 2>&1)"; then
              printf '%s\n' "$out"
              op="$(printf '%s\n' "$out" | jq -r '.OperationId // empty')"
              [ -n "$op" ] && break
            else
              printf '%s\n' "$out"
              case "$out" in
                *InvalidRequestException*|*"isn't in RUNNING state"*) sleep 20 ;;
                *) echo "::error::start-deployment failed"; exit 1 ;;
              esac
            fi
          done
          if [ -z "$op" ]; then
            echo "::error::start-deployment returned no OperationId"
            exit 1
          fi

          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(aws apprunner list-operations \
              --service-arn "$ARN" \
              --query "OperationSummaryList[?Id=='${op}'].Status | [0]" \
              --output text)"
            echo "deployment ${op} status=${status:-unknown}"
            case "$status" in
              SUCCEEDED) exit 0 ;;
              FAILED|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED)
                echo "::error::App Runner deployment ${op} ended as ${status}"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::timed out waiting for deployment ${op}"
          exit 1
