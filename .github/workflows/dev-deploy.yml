# DEV deploy for admin.ilovelearningguide.com.
# Requires repo variable ADMIN_DEV_APP_RUNNER_SERVICE_ARN; the workflow fails with
# a clear message until the service is provisioned.
name: Deploy DEV

on:
  workflow_run:
    workflows: [CI]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the DEV service ARN
        env:
          ARN: ${{ vars.ADMIN_DEV_APP_RUNNER_SERVICE_ARN }}
        run: |
          if [ -z "$ARN" ]; then
            echo "::error::ADMIN_DEV_APP_RUNNER_SERVICE_ARN is not set. Provision the DEV App Runner service first."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Start App Runner deployment
        env:
          ARN: ${{ vars.ADMIN_DEV_APP_RUNNER_SERVICE_ARN }}
        run: |
          aws apprunner start-deployment --service-arn "$ARN" --output json
